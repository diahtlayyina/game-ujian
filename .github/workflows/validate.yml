name: Validate Treasure Quiz
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for f in src/*.js sw.js; do node --check "$f"; done
      - name: Verify required app files
        run: |
          for f in index.html styles.css sw.js manifest.webmanifest vercel.json src/main.js src/game.js src/questions.js; do test -s "$f"; done
      - name: Run game-logic tests
        run: node tests/logic.test.mjs
