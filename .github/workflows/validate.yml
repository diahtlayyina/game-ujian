name: Validate Treasure Quiz
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check src/main.js
          node --check src/questions.js
      - name: Verify required app files
        run: |
          test -s index.html
          test -s styles.css
          test -s src/main.js
          test -s src/questions.js
