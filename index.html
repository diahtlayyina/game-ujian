<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#86d5ff">
  <meta name="description" content="Petualangan kuis Bahasa Indonesia untuk kelas 4: jelajahi lima wilayah, kumpulkan poin, dan temukan harta karun pengetahuan.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/treasure.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">
  <title>Treasure Quiz — The Lost Treasure of Knowledge</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <noscript><p style="padding:24px;font:18px sans-serif">Game ini membutuhkan JavaScript. Aktifkan JavaScript lalu muat ulang halaman.</p></noscript>
  <main id="app"><p id="boot">Memuat petualangan… 🗺️</p></main>
  <div id="fx" aria-hidden="true"></div>
  <script type="module" src="./src/main.js"></script>
  <script>
    // Safety net: if the game has not started after a few seconds (blocked/stale files), offer a clean reload.
    setTimeout(function () {
      var b = document.getElementById("boot");
      if (!b) return;
      b.innerHTML = 'Game belum termuat. <button id="fix" style="font:inherit;padding:8px 16px;border-radius:12px;border:0;background:#22b573;color:#fff;cursor:pointer">Muat ulang bersih</button>';
      document.getElementById("fix").onclick = function () {
        var rs = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
        rs.then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })
          .then(function () { return window.caches ? caches.keys() : []; })
          .then(function (k) { return Promise.all(k.map(function (n) { return caches.delete(n); })); })
          .then(function () { location.reload(); }, function () { location.reload(); });
      };
    }, 5000);
  </script>
</body>
</html>
